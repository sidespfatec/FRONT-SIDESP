name: Validar frontend e autenticacao
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: sidesp-ci-test-only
          MARIADB_DATABASE: sidesp_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/sidesp_test
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: sidesp-ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: chmod +x mvnw
        working-directory: backend
      - run: ./mvnw --batch-mode verify
        working-directory: backend
