<nav class="navbar-admin">
    <figure class="navbar-logo">
        <img src="assets/images/logo.png" alt="Logo">
    </figure>

    <div class="navbar-right">
        <ul class="navbar-links">
            <li><a routerLink="/home" routerLinkActive="active">INICIAL</a></li>
        </ul>

        @if (currentPageLabel()) {
        <span class="current-page-badge">{{ currentPageLabel() }}</span>
        }

        @if (adminPages().length) {
        <button type="button" class="menu-toggle-btn" [class.active]="isMenuOpen()" (click)="toggleMenu()"
            [attr.aria-expanded]="isMenuOpen()" aria-controls="menu-admin" aria-label="Abrir menu de gestão">
            <i class="pi pi-bars" aria-hidden="true"></i>
        </button>
        }

        @if (auth.user(); as usuario) {
        <span class="navbar-user">{{ usuario.nome }}</span>
        <button pButton type="button" label="SAIR" icon="pi pi-sign-out" class="navbar-login-btn"
            (click)="sair()"></button>
        } @else {
        <button pButton type="button" label="LOGIN" icon="pi pi-user" routerLink="/login"
            class="navbar-login-btn"></button>
        }
    </div>

    @if (adminPages().length) {
    <div class="admin-submenu" id="menu-admin" [class.open]="isMenuOpen()">
        @for (page of adminPages(); track page.path) {
        <a [routerLink]="page.path" routerLinkActive="active-pill" class="submenu-pill"
            (click)="fecharMenu()">{{ page.label }}</a>
        }
    </div>
    }
</nav>
