<p-dialog header="Adicionar Notícia" [(visible)]="viewModal" [modal]="true" [style]="{ width: '32rem' }"
    [breakpoints]="{ '640px': '90vw' }" [draggable]="false" (onHide)="close.emit()">
    <div class="news-form">
        <div class="field">
            <label>Imagem</label>
            <input #fileInput type="file" accept="image/*" hidden (change)="onFileSelected($event)" />
            <div class="dropzone" [class.has-image]="imagePreview" (click)="fileInput.click()">
                @if (imagePreview) {
                <img [src]="imagePreview" alt="Pré-visualização">
                <span class="change-hint"><i class="pi pi-pencil"></i> Trocar imagem</span>
                } @else {
                <i class="pi pi-image"></i>
                <span>Clique para escolher uma imagem</span>
                <small>JPG, PNG ou WEBP, até 10 MB</small>
                }
            </div>
        </div>

        @if (erroImagem) {
        <small class="erro-imagem" role="alert">{{ erroImagem }}</small>
        }

        <div class="field">
            <label for="news-title">Título</label>
            <input pInputText id="news-title" [(ngModel)]="title" [maxlength]="tituloMax"
                placeholder="Digite o título da notícia" />
        </div>

        <div class="field">
            <label for="news-description">Descrição</label>
            <textarea pInputText id="news-description" rows="5" [(ngModel)]="description"
                placeholder="Escreva os detalhes da notícia"></textarea>
        </div>

        <div class="field">
            <label>Período no ar</label>
            <p-selectbutton [options]="opcoesPeriodo" optionLabel="label" optionValue="value"
                [(ngModel)]="periodo" [allowEmpty]="false" />
        </div>

        <!-- data futura entra como EM ESPERA no banco; o back decide pelo horário -->
        @if (periodo === 'FIXA') {
        <div class="field">
            <label for="news-date">Publicar em</label>
            <p-datepicker inputId="news-date" [(ngModel)]="publicarEm" [showTime]="true"
                dateFormat="dd/mm/yy" [minDate]="agora" [showIcon]="true" appendTo="body"
                placeholder="Deixe vazio para publicar agora" />
        </div>
        }

        <!-- selectionMode range: o primeiro clique marca o início, o segundo o fim -->
        @if (periodo === 'PRAZO') {
        <div class="field">
            <label for="news-range">No ar de / até</label>
            <p-datepicker inputId="news-range" [(ngModel)]="intervalo" selectionMode="range"
                dateFormat="dd/mm/yy" [minDate]="agora" [showIcon]="true" appendTo="body"
                [readonlyInput]="true" placeholder="Escolha o início e o fim" />

            @if (!temIntervaloCompleto) {
            <small class="dica">Clique no primeiro dia e depois no último.</small>
            }
        </div>
        }

        <div class="actions">
            <button type="button" pButton severity="secondary" (click)="close.emit()">Cancelar</button>
            <button type="button" pButton [disabled]="!podeSalvar" (click)="onSave()">Salvar</button>
        </div>
    </div>
</p-dialog>
