<p-card class="card" (click)="openNews.emit(news)">
    <figure>
        <img [src]="news.image" [alt]="news.title">
    </figure>

    <div class="description-card">
        <h2>{{ news.title }}</h2>

        <p class="quando">
            {{ news.date | date:'dd/MM/yyyy' }}
            @if (news.fim) {
            <span class="ate">até {{ news.fim | date:'dd/MM/yyyy' }}</span>
            } @else {
            <span class="fixa">fixa</span>
            }
        </p>
    </div>

    <div class="footer-card">
        <button pButton type="button" class="p-button-sm">Saiba mais</button>

        @if (gerenciar) {
        <div class="gerenciar" (click)="aoClicar($event)">
            @if (confirmando) {
            <span class="pergunta">Apagar?</span>
            <button type="button" class="sim" (click)="apagar.emit(news)">Sim</button>
            <button type="button" class="nao" (click)="confirmando = false">Não</button>
            } @else {
            <button type="button" class="acao" (click)="arquivar.emit(news)"
                aria-label="Arquivar notícia" title="Arquivar">
                <i class="pi pi-inbox"></i>
            </button>
            <button type="button" class="acao" (click)="confirmando = true"
                aria-label="Apagar notícia" title="Apagar">
                <i class="pi pi-trash"></i>
            </button>
            }
        </div>
        }
    </div>
</p-card>
