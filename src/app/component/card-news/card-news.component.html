<p-card class="card" (click)="openNews.emit(news)">
    <figure>
        <img [src]="news.image" [alt]="news.title">
    </figure>
    <div class="description-card">
        <h2>{{ news.title }}</h2>
    </div>
    <div class="footer-card">
        <button pButton type="button" class="p-button-sm">Saiba mais</button>
    </div>
</p-card>
