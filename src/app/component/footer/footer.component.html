<footer>
    <a [routerLink]="['/home']" class="nav-item" aria-label="Início">
        <i class="pi pi-home" aria-hidden="true"></i>
    </a>

    <a [routerLink]="[rotaPerfil()]" class="nav-item" aria-label="Perfil">
        <i class="pi pi-user" aria-hidden="true"></i>
    </a>

    @if (grupos().length) {
    <button type="button" class="nav-item" (click)="abrirMenu()" aria-label="Abrir menu de gestão"
        [attr.aria-expanded]="menuAberto">
        <i class="pi pi-bars" aria-hidden="true"></i>
    </button>
    }
</footer>

<p-drawer [(visible)]="menuAberto" position="right" styleClass="menu-admin-drawer">
    <ng-template pTemplate="header">
        <div class="drawer-header">
            <h2 class="drawer-titulo">Menu</h2>
        </div>
    </ng-template>

    <div class="drawer-conteudo">
        @for (grupo of grupos(); track grupo.titulo) {
        <section class="grupo">
            <h3 class="grupo-titulo">{{ grupo.titulo }}</h3>
            <div class="grupo-itens">
                @for (item of grupo.itens; track item.rota) {
                <a [routerLink]="item.rota" class="menu-item" (click)="fecharMenu()">
                    <div class="menu-item-icone">
                        <i [class]="item.icone" aria-hidden="true"></i>
                    </div>
                    <span class="menu-item-nome">{{ item.nome }}</span>
                    <i class="pi pi-chevron-right menu-item-seta" aria-hidden="true"></i>
                </a>
                }
            </div>
        </section>
        }
    </div>
</p-drawer>
