<app-navbar-desktop-admin></app-navbar-desktop-admin>
@if (auth.user()) {
<app-session></app-session>
}
<app-banner></app-banner>

<div class="home-container">
    <section class="hero-banner">
    </section>
    <div class="header-container">

        <h1 class="title-home">
            NOTÍCIAS
        </h1>
        @if(auth.isAdmin()){<div class="button-container">
            <button pButton type="button" class="p-button-sm" (click)="openModal()">
                <i class="pi pi-plus"></i>
            </button>
        </div>}
    </div>
    <div class="cards-container">
        @for (item of newsList; track item.id) {
        <app-card-news [news]="item" (openNews)="openNews($event)"></app-card-news>
        }
    </div>
</div>
<app-footer></app-footer>

@if (selectedNews) {
<app-news-detail-modal [news]="selectedNews" (close)="closeNews()"></app-news-detail-modal>
}
@if (viewModal == true) {
<app-new-card-news (close)="closeModal()" (save)="addNews($event)"></app-new-card-news>
}
