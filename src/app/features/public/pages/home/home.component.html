
<div class="home-container">
    <section class="hero-banner">
    </section>
    <div class="header-container">

        <h1 class="title-home">
            NOTÍCIAS
        </h1>
        <div class="button-container">
            <button pButton type="button" class="p-button-sm" (click)="openModal()">
                <i class="pi pi-plus"></i>
            </button>
        </div>
    </div>
    <div class="abas-news">
        <button type="button" [class.ativa]="!verArquivadas" (click)="verArquivadas = false">
            Publicadas
        </button>
        <button type="button" [class.ativa]="verArquivadas" (click)="verArquivadas = true">
            Arquivadas ({{ totalArquivadas }})
        </button>
    </div>

    <div class="cards-container">
        @for (item of listaVisivel; track item.id) {
        <app-card-news [news]="item" [gerenciar]="true" (openNews)="openNews($event)"
            (arquivar)="arquivarNews($event)" (apagar)="apagarNews($event)"></app-card-news>
        } @empty {
        <p class="news-vazio">
            {{ verArquivadas ? 'Nenhuma notícia arquivada.' : 'Nenhuma notícia publicada no momento.' }}
        </p>
        }
    </div>
</div>

@if (selectedNews) {
<app-news-detail-modal [news]="selectedNews" (close)="closeNews()"></app-news-detail-modal>
}
@if (viewModal == true) {
<app-new-card-news (close)="closeModal()" (save)="addNews($event)"></app-new-card-news>
}
