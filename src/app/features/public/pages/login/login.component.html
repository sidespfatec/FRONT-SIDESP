<main class="main-container">
    <app-banner></app-banner>

    <div class="layout-login">
        <div class="login-card">

            <header class="login-header">
                <div class="login-badge">
                    <i class="pi pi-user"></i>
                </div>
                <h1 class="title-login">Fazer login</h1>
                <p class="subtitle-login">Acesse sua conta com CPF ou e-mail</p>
            </header>

            @if (registered) {
            <p class="form-ok" role="status">Cadastro concluído! Faça login com o CPF ou e-mail do titular.</p>
            }

            @if (error()) {
            <p class="form-error" role="alert">{{ error() }}</p>
            }

            <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">

                <div class="input-login">
                    <label for="identificador">CPF ou e-mail</label>
                    <div class="input-wrap">
                        <i class="pi pi-id-card"></i>
                        <input pInputText id="identificador" formControlName="identificador" autocomplete="username"
                            placeholder="000.000.000-00 ou seu e-mail" />
                    </div>
                </div>

                <div class="input-login">
                    <label for="password">Senha</label>
                    <div class="input-wrap">
                        <i class="pi pi-lock"></i>
                        <input pInputText id="password" type="password" formControlName="senha"
                            autocomplete="current-password" placeholder="Digite sua senha" />
                    </div>
                    <a class="forgot-link" href="#" (click)="$event.preventDefault(); recovery()">
                        Esqueci minha senha
                    </a>
                </div>

                <p-button class="button-login" [label]="busy() ? 'ENTRANDO...' : 'ENTRAR'" icon="pi pi-sign-in"
                    type="submit" [disabled]="busy()" />
            </form>

            <div class="register-area">
                <p class="question-register">Ainda não tem conta?</p>
                <p-button class="button-register" label="CADASTRE-SE" icon="pi pi-user-plus" type="button"
                    routerLink="/registration" />
            </div>

        </div>
    </div>
</main>
