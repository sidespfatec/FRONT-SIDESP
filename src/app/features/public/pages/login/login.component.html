<main class="main-container">
    <div class="layout-login">
        <div class="login-card">

            <header class="login-header">
                <div class="login-badge">
                    <i class="pi pi-user"></i>
                </div>
                <h1 class="title-login">Fazer login</h1>
                <p class="subtitle-login">Acesse sua conta com CPF e senha</p>
            </header>

            <!-- (ngSubmit) faz o Enter funcionar, que é como se usa um login.
                 O $event.preventDefault() não é preciso: ngSubmit já segura
                 o recarregamento da página. -->
            <form class="login-form" (ngSubmit)="entrar()">
                <div class="input-login">
                    <label for="cpf">CPF</label>
                    <div class="input-wrap">
                        <i class="pi pi-id-card"></i>
                        <!-- [(ngModel)] é ligação de mão dupla: o que é digitado
                             vai para a variável, e o valor da variável aparece
                             no campo. O standalone: true dispensa o 'name',
                             que o Angular exigiria dentro de um <form>. -->
                        <p-inputmask inputId="cpf" mask="999.999.999-99" placeholder="000.000.000-00"
                            [autoClear]="false" styleClass="w-full"
                            [(ngModel)]="cpf" [ngModelOptions]="{ standalone: true }" />
                    </div>
                </div>

                <div class="input-login">
                    <label for="password">Senha</label>
                    <div class="input-wrap">
                        <i class="pi pi-lock"></i>
                        <input pInputText id="password" type="password" placeholder="Digite sua senha"
                            [(ngModel)]="senha" [ngModelOptions]="{ standalone: true }" />
                    </div>
                    <a class="forgot-link" routerLink="/recuperar-senha">Esqueci minha senha</a>
                    <a class="forgot-link" routerLink="/primeiro-acesso">Primeiro acesso</a>
                </div>

                <!-- role="alert" faz o leitor de tela anunciar o erro assim
                     que ele aparece, sem a pessoa precisar procurar. -->
                @if (erro) {
                <p class="login-erro" role="alert">{{ erro }}</p>
                }

                <!-- type="submit" para o Enter cair no (ngSubmit) do form.
                     O routerLink saiu: agora quem decide para onde ir é o
                     perfil que voltou do back. -->
                <p-button class="button-login" type="submit"
                    [label]="entrando ? 'ENTRANDO...' : 'ENTRAR'"
                    icon="pi pi-sign-in" [disabled]="entrando" />
            </form>

            <div class="register-area">
                <p class="question-register">Ainda não tem conta?</p>
                <p-button class="button-register" label="CADASTRE-SE" icon="pi pi-user-plus"
                    routerLink="/registration" />
            </div>

        </div>
    </div>
</main>
