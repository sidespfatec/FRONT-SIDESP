<main class="main-container">
  <app-banner></app-banner>
  <div class="layout-login">
    <div class="login-container">
      <h1 class="title-login">LOGIN</h1>
      @if (registered) {
        <p role="status">Cadastro concluído! Faça login com o CPF ou e-mail do titular.</p>
      }
      @if (error()) {
        <p role="alert" class="form-error">{{ error() }}</p>
      }
      <form class="space-y-6 mt-3" [formGroup]="form" (ngSubmit)="submit()">
        <div class="input-login flex flex-col gap-2">
          <label for="cpf">CPF ou e-mail</label>
          <input
            pInputText
            id="cpf"
            aria-describedby="cpf-help"
            formControlName="identificador"
            autocomplete="username"
          />
          <small id="cpf-help" class="text-sm">Digite seu CPF ou e-mail.</small>
        </div>
        <div class="input-login flex flex-col gap-2">
          <label pLabel for="password">Senha</label>
          <input
            pInputText
            id="password"
            type="password"
            formControlName="senha"
            autocomplete="current-password"
          />
          <small id="senha-help" class="text-sm">Digite sua senha.</small>
          <a
            href="#"
            class="text-right text-sm text-blue-500"
            (click)="$event.preventDefault(); recovery()"
            >Esqueci minha senha</a
          >
        </div>
        <p-button
          class="button-login"
          [label]="busy() ? 'Entrando…' : 'ENTRAR'"
          type="submit"
          [disabled]="busy()"
        />

        <p class="question-register">Não possui cadastro?</p>
        <p-button
          class="button-register"
          label="CADASTRE-SE"
          type="button"
          routerLink="/registration"
        />
      </form>
    </div>
  </div>
</main>
