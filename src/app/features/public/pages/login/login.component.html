
<main class="main-container">
  <app-banner></app-banner>

  <div class="layout-login">
    <div class="login-card">
      <header class="login-header">
        <div class="login-badge">
          <i class="pi pi-user"></i>
        </div>

        <h1 class="title-login">Fazer login</h1>
        <p class="subtitle-login">
          Acesse sua conta com CPF ou e-mail e senha
        </p>
      </header>

      @if (registered) {
        <p role="status">
          Cadastro concluído! Faça login com seu CPF ou e-mail.
        </p>
      }

      @if (error()) {
        <p role="alert" class="form-error">{{ error() }}</p>
      }

      <form
        class="login-form"
        [formGroup]="form"
        (ngSubmit)="submit()"
      >
        <div class="input-login">
          <label for="cpf">CPF ou e-mail</label>

          <div class="input-wrap">
            <i class="pi pi-id-card"></i>
            <input
              pInputText
              id="cpf"
              formControlName="identificador"
              placeholder="Digite seu CPF ou e-mail"
              autocomplete="username"
            />
          </div>
        </div>

        <div class="input-login">
          <label for="password">Senha</label>

          <div class="input-wrap">
            <i class="pi pi-lock"></i>
            <input
              pInputText
              id="password"
              type="password"
              formControlName="senha"
              placeholder="Digite sua senha"
              autocomplete="current-password"
            />
          </div>

          <a
            href="#"
            class="forgot-link"
            (click)="$event.preventDefault(); recovery()"
          >
            Esqueci minha senha
          </a>
        </div>

        <p-button
          class="button-login"
          [label]="busy() ? 'Entrando...' : 'ENTRAR'"
          icon="pi pi-sign-in"
          type="submit"
          [disabled]="busy()"
        />

        <div class="register-area">
          <p class="question-register">Ainda não tem conta?</p>

          <p-button
            class="button-register"
            label="CADASTRE-SE"
            icon="pi pi-user-plus"
            type="button"
            routerLink="/registration"
          />
        </div>
      </form>
    </div>
  </div>
</main>
