<app-navbar-desktop-admin></app-navbar-desktop-admin>
<app-banner></app-banner>

<div class="card-container">
    <p-card>
        <h1 class="title-modality">Nova modalidade</h1>

        @if (errorMessage) {
        <p class="modality-alert" role="alert">{{ errorMessage }}</p>
        }

        <form class="modality-form" (ngSubmit)="save()">
            <div class="modality-field">
                <label for="name">Nome da modalidade</label>
                <input id="name" name="name" pInputText [(ngModel)]="name" required maxlength="80"
                    placeholder="Ex.: Futsal Sub-15" />
            </div>

            <div class="form-grid">
                <div class="modality-field">
                    <label for="minAge">Idade mínima</label>
                    <input id="minAge" name="minAge" pInputText type="number" min="0" max="120" step="1"
                        [(ngModel)]="minAge" required />
                </div>

                <div class="modality-field">
                    <label for="maxAge">Idade máxima</label>
                    <input id="maxAge" name="maxAge" pInputText type="number" min="0" max="120" step="1"
                        [(ngModel)]="maxAge" required />
                </div>
            </div>

            <div class="form-grid">
                <div class="modality-field">
                    <label for="monthlyAbsenceLimit">Limite de faltas mensais</label>
                    <input id="monthlyAbsenceLimit" name="monthlyAbsenceLimit" pInputText type="number" min="0"
                        max="31" step="1" [(ngModel)]="monthlyAbsenceLimit" required />
                </div>

                <div class="modality-field">
                    <label for="hub">Polo esportivo</label>
                    <p-select inputId="hub" name="hub" [options]="hubs" optionLabel="name" optionValue="id"
                        [(ngModel)]="hubId" placeholder="Selecione um polo" appendTo="body" />
                </div>
            </div>

            <div class="modality-field">
                <label for="icon">Ícone (opcional)</label>
                <p-select inputId="icon" name="icon" [options]="icons" optionLabel="label" optionValue="value"
                    [(ngModel)]="icon" appendTo="body" />
            </div>

            <p class="active-tip">
                A modalidade será cadastrada como <strong>ativa</strong> e poderá ser inativada na listagem.
            </p>

            <div class="modality-actions">
                <p-button label="Cancelar" severity="secondary" [text]="true" type="button" (onClick)="cancel()" />
                <p-button label="Cadastrar" icon="pi pi-check" type="submit" />
            </div>
        </form>
    </p-card>
</div>

<app-footer></app-footer>
