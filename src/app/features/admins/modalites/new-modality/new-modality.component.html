<app-navbar-desktop-admin /><app-banner />
<div class="card-container">
  <p-card
    ><h1 class="title-modality">Nova modalidade</h1>
    <form
      #modalityForm="ngForm"
      (ngSubmit)="save(modalityForm)"
      class="integration-form modality-form"
    >
      <fieldset [disabled]="busy()">
        <div class="modality-fields">
          <label for="modality-name"
            >Nome *<input
              pInputText
              id="modality-name"
              name="nome"
              [(ngModel)]="model.nome"
              maxlength="100"
              required /></label
          ><label for="modality-min"
            >Idade mínima *<input
              pInputText
              id="modality-min"
              name="idadeMinima"
              type="number"
              [(ngModel)]="model.idadeMinima"
              required
              min="0"
              max="130"
              step="1" /></label
          ><label for="modality-max"
            >Idade máxima *<input
              pInputText
              id="modality-max"
              name="idadeMaxima"
              type="number"
              [(ngModel)]="model.idadeMaxima"
              required
              min="0"
              max="130"
              step="1" /></label
          ><label for="modality-absences"
            >Limite de faltas mensais *<input
              pInputText
              id="modality-absences"
              name="limiteFaltasMensais"
              type="number"
              [(ngModel)]="model.limiteFaltasMensais"
              required
              min="0"
              max="31"
              step="1" /></label
          ><label for="modality-hub"
            >Polo *<select id="modality-hub" name="poloId" [(ngModel)]="model.poloId" required>
              <option [ngValue]="null">Selecione um polo ativo</option>
              @for (hub of hubs(); track hub.id) {
                <option [ngValue]="hub.id">{{ hub.nome }}</option>
              }
            </select></label
          >
        </div>
      </fieldset>
      @if (loading()) {
        <p role="status">Carregando polos...</p>
      }
      @if (!loading() && !hubs().length) {
        <p>Cadastre ou reative um polo antes de cadastrar a modalidade.</p>
        <button pButton type="button" (click)="loadHubs()">Atualizar polos</button>
      }
      @if (error()) {
        <p role="alert">{{ error() }}</p>
      }
      <p>A modalidade será criada ativa. A situação pode ser alterada na listagem.</p>
      <div class="form-actions">
        <button
          pButton
          severity="secondary"
          [text]="true"
          type="button"
          (click)="cancel()"
          [disabled]="busy()"
        >
          Cancelar</button
        ><button pButton type="submit" [disabled]="busy() || loading() || !hubs().length">
          {{ busy() ? 'Salvando...' : 'Cadastrar' }}
        </button>
      </div>
    </form></p-card
  >
</div>
<app-footer />
