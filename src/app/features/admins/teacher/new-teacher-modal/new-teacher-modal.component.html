<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '340px' }" [draggable]="false" [resizable]="false"
    header="Novo professor">
    <div class="modal-content">
        <p class="section-title">Dados pessoais</p>
        <div class="field-group">
            <div class="field">
                <label>Nome completo</label>
                <input pInputText placeholder="Nome do professor" />
            </div>
            <div class="field-row">
                <div class="field">
                    <label>CPF</label>
                    <input pInputText placeholder="000.000.000-00" />
                </div>
                <div class="field">
                    <label>Data nasc.</label>
                    <input pInputText type="date" />
                </div>
            </div>
            <div class="field">
                <label>Email</label>
                <input pInputText type="email" placeholder="nome@guaratingueta.sp.gov.br" />
            </div>
            <div class="field">
                <label>Telefone</label>
                <input pInputText placeholder="(12) 90000-0000" />
            </div>
        </div>

        <hr class="divider" />

        <p class="section-title">Endereço</p>
        <div class="field-group">
            <div class="field-row">
                <div class="field field-grow">
                    <label>CEP</label>
                    <input pInputText placeholder="00000-000" />
                </div>
                <div class="field field-small">
                    <label>Número</label>
                    <input pInputText placeholder="0" />
                </div>
            </div>
            <div class="field">
                <label>Rua</label>
                <input pInputText placeholder="Nome da rua" />
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Bairro</label>
                    <input pInputText placeholder="Bairro" />
                </div>
                <div class="field">
                    <label>Cidade</label>
                    <input pInputText placeholder="Guaratinguetá" />
                </div>
            </div>
        </div>

        <hr class="divider" />

        <p class="section-title">Atuação</p>
        <div class="field-group">
            <div class="field">
                <label>Modalidade</label>
                <p-select [options]="modalities" optionLabel="label" optionValue="value"
                    placeholder="Selecione uma modalidade" styleClass="full-width" />
            </div>
            <div class="field">
                <label>Turma</label>
                <p-select [options]="classGroups" optionLabel="label" optionValue="value"
                    placeholder="Selecione uma turma" styleClass="full-width" />
            </div>
        </div>

        <hr class="divider" />

        <p class="section-title">Currículo</p>
        <div class="field-group">
            <p-fileUpload mode="basic" chooseLabel="Anexar currículo (PDF)" accept=".pdf" styleClass="full-width" />
        </div>
    </div>

    <ng-template pTemplate="footer">
        <button pButton type="button" label="Cancelar" class="p-button-outlined" (click)="onCancel()"></button>
        <button pButton type="button" label="Salvar" class="btn-save"></button>
    </ng-template>
</p-dialog>
