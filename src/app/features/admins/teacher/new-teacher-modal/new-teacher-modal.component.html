<p-dialog styleClass="teacher-dialog" [(visible)]="visible" (visibleChange)="visibleChange.emit($event)" [modal]="true"
    [draggable]="false" [resizable]="false" [header]="teacher ? teacher.nome : 'Novo professor'">

    <form class="teacher-form" [formGroup]="form">
        @if (error()) { <p role="alert">{{ error() }}</p> }
        @if (teacher) { <p>Os dados abaixo são os disponíveis para consulta. A edição cadastral ainda não está disponível.</p> }

        <h2 class="teacher-form-title">Dados pessoais</h2>

        <div class="teacher-field">
            <label for="nome">Nome completo</label>
            <input formControlName="nome" [readonly]="!!teacher" id="nome" pInputText />
        </div>

        <div class="teacher-field-row">
            <div class="teacher-field">
                <label for="cpf">CPF</label>
                <input formControlName="cpf" [readonly]="!!teacher" id="cpf" pInputText placeholder="000.000.000-00" />
            </div>
            <div class="teacher-field">
                <label for="nascimento">Data de nascimento</label>
                <input formControlName="nascimento" [readonly]="!!teacher" id="nascimento" pInputText type="date" />
            </div>
        </div>

        <div class="teacher-field">
            <label for="email">E-mail</label>
            <input formControlName="email" [readonly]="!!teacher" id="email" pInputText type="email" />
        </div>

        <div class="teacher-field">
            <label for="telefone">Telefone</label>
            <input formControlName="telefone" [readonly]="!!teacher" id="telefone" pInputText placeholder="(12) 90000-0000" />
        </div>

        <h2 class="teacher-form-title">Endereço</h2>

        <div class="teacher-field-row">
            <div class="teacher-field teacher-field-grow">
                <label for="cep">CEP</label>
                <input formControlName="cep" [readonly]="!!teacher" id="cep" pInputText placeholder="00000-000" />
            </div>
            <div class="teacher-field teacher-field-small">
                <label for="numero">Número</label>
                <input formControlName="numero" [readonly]="!!teacher" id="numero" pInputText />
            </div>
        </div>

        <div class="teacher-field">
            <label for="rua">Rua</label>
            <input formControlName="rua" [readonly]="!!teacher" id="rua" pInputText />
        </div>

        <div class="teacher-field-row">
            <div class="teacher-field">
                <label for="bairro">Bairro</label>
                <input formControlName="bairro" [readonly]="!!teacher" id="bairro" pInputText />
            </div>
            <div class="teacher-field">
                <label for="cidade">Cidade</label>
                <input formControlName="cidade" [readonly]="!!teacher" id="cidade" pInputText />
            </div>
        </div>

        <h2 class="teacher-form-title">Atuação</h2>

        <div class="teacher-field">
            <label for="modalidade">Modalidade</label>
            <p-select formControlName="especialidade" [disabled]="!!teacher" inputId="modalidade" [options]="modalities" optionLabel="label" optionValue="value"
                appendTo="body" />
        </div>

        <div class="teacher-field">
            <label for="turma">Turma</label>
            <p-select [disabled]="true" placeholder="Vínculo ainda não disponível" inputId="turma" [options]="classGroups" optionLabel="label" optionValue="value" appendTo="body" />
        </div>


        @if (!teacher) {
        <div class="teacher-field-row">
          <div class="teacher-field"><label for="genero">Gênero</label><p-select inputId="genero" formControlName="genero" [options]="genderOptions" optionLabel="label" optionValue="value" appendTo="body" /></div>
          <div class="teacher-field"><label for="uf">UF</label><input id="uf" pInputText formControlName="uf" maxlength="2" /></div>
        </div>
        <div class="teacher-field"><label for="registro">Registro profissional</label><input id="registro" pInputText formControlName="registro" /></div>
        <div class="teacher-field-row">
          <div class="teacher-field"><label for="senha">Senha inicial</label><input id="senha" pInputText type="password" formControlName="senha" autocomplete="new-password" /></div>
          <div class="teacher-field"><label for="confirmacao">Confirmar senha</label><input id="confirmacao" pInputText type="password" formControlName="confirmacao" autocomplete="new-password" /></div>
        </div>
        }
        <h2 class="teacher-form-title">Currículo</h2>

        <p-fileUpload [disabled]="true" mode="basic" chooseLabel="Anexar currículo (PDF)" accept=".pdf" />
    </form>

    <ng-template pTemplate="footer">
        <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="onCancel()" />
        <p-button label="Salvar" icon="pi pi-check" [disabled]="!!teacher" [loading]="busy()" (onClick)="submit()" />
    </ng-template>
</p-dialog>
