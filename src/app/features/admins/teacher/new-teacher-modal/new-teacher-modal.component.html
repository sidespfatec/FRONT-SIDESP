<p-dialog styleClass="teacher-dialog" [(visible)]="visible" (visibleChange)="visibleChange.emit($event)" [modal]="true"
    [draggable]="false" [resizable]="false" header="Novo professor">

    <form class="teacher-form">

        <h2 class="teacher-form-title">Dados pessoais</h2>

        <div class="teacher-field">
            <label for="nome">Nome completo</label>
            <input id="nome" pInputText [(ngModel)]="nome" name="nome" />
        </div>

        <div class="teacher-field-row">
            <div class="teacher-field">
                <label for="cpf">CPF</label>
                <p-inputmask maskCaret inputId="cpf" mask="999.999.999-99" placeholder="000.000.000-00"
                    [autoClear]="false" [(ngModel)]="cpf" name="cpf" />
            </div>
            <div class="teacher-field">
                <label for="nascimento">Data de nascimento</label>
                <input id="nascimento" pInputText type="date" [(ngModel)]="nascimento" name="nascimento" />
                @if (nascimento && !maiorDeIdade) {
                <small class="teacher-field-aviso">O professor precisa ser maior de idade.</small>
                }
            </div>
        </div>

        <div class="teacher-field">
            <label>Gênero</label>
            <p-selectbutton [options]="generos" [(ngModel)]="genero" name="genero" optionLabel="label"
                optionValue="value" [allowEmpty]="false" />
        </div>

        <div class="teacher-field">
            <label for="email">E-mail</label>
            <input id="email" pInputText type="email" [(ngModel)]="email" name="email" />
        </div>

        <div class="teacher-field">
            <label for="telefone">Telefone</label>
            <p-inputmask maskCaret inputId="telefone" mask="(99) 99999-9999" placeholder="(12) 90000-0000" [autoClear]="false"
                [(ngModel)]="telefone" name="telefone" />
        </div>

        <h2 class="teacher-form-title">Endereço</h2>

        <div class="teacher-field-row">
            <div class="teacher-field teacher-field-grow">
                <label for="cep">CEP</label>
                <p-inputmask maskCaret inputId="cep" mask="99999-999" placeholder="00000-000" [autoClear]="false"
                    [(ngModel)]="cep" name="cep" />
            </div>
            <div class="teacher-field teacher-field-small">
                <label for="numero">Número</label>
                <input id="numero" pInputText [(ngModel)]="numero" name="numero" />
            </div>
        </div>

        <div class="teacher-field">
            <label for="rua">Rua</label>
            <input id="rua" pInputText [(ngModel)]="rua" name="rua" />
        </div>

        <div class="teacher-field">
            <label for="complemento">Complemento</label>
            <input id="complemento" pInputText [(ngModel)]="complemento" name="complemento" />
        </div>

        <div class="teacher-field-row">
            <div class="teacher-field">
                <label for="bairro">Bairro</label>
                <input id="bairro" pInputText [(ngModel)]="bairro" name="bairro" />
            </div>
            <div class="teacher-field teacher-field-small">
                <label for="uf">UF</label>
                <p-select inputId="uf" [options]="ufs" [(ngModel)]="uf" name="uf" placeholder="UF" appendTo="body" />
            </div>
        </div>

        <div class="teacher-field">
            <label for="cidade">Cidade</label>
            <input id="cidade" pInputText [(ngModel)]="cidade" name="cidade" />
        </div>

        <h2 class="teacher-form-title">Dados profissionais</h2>

        <div class="teacher-field">
            <label>Tipo de vínculo</label>
            <p-selectbutton [options]="contractTypes" [(ngModel)]="contractType" name="contractType" optionLabel="label"
                optionValue="value" [allowEmpty]="false" />
        </div>

        <div class="teacher-field-row">
            <div class="teacher-field teacher-field-grow">
                <label for="cref">CREF</label>
                <p-inputmask maskCaret inputId="cref" mask="999999-a/aa" placeholder="000000-G/SP"
                    styleClass="uppercase" [autoClear]="false" [(ngModel)]="cref" name="cref" />
            </div>
            <div class="teacher-field teacher-field-small">
                <label for="camiseta">Camiseta</label>
                <p-select inputId="camiseta" [options]="shirtSizes" [(ngModel)]="shirtSize" name="shirtSize"
                    optionLabel="label" optionValue="value" placeholder="Tam." appendTo="body" />
            </div>
        </div>

        <h2 class="teacher-form-title">Atuação</h2>

        <div class="teacher-field">
            <label for="modalidades">Modalidades</label>
            <p-multiselect inputId="modalidades" [options]="modalities()" [(ngModel)]="selectedModalities"
                name="selectedModalities" optionLabel="label" optionValue="value" display="chip"
                placeholder="Selecione as modalidades" appendTo="body" />
        </div>

        <div class="teacher-field">
            <label for="turma">Turma</label>
            <p-select inputId="turma" [options]="classGroups" optionLabel="label" optionValue="value"
                placeholder="Selecione uma turma" appendTo="body" [(ngModel)]="classGroup" name="classGroup" />
        </div>

        <h2 class="teacher-form-title">Currículo</h2>

        <p-fileUpload mode="basic" chooseLabel="Anexar currículo (PDF)" accept=".pdf" />

        @if (erro(); as mensagem) {
        <p class="teacher-form-erro">{{ mensagem }}</p>
        }
    </form>

    <ng-template pTemplate="footer">
        <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="onCancel()" />
        <p-button label="Salvar" icon="pi pi-check" [loading]="salvando()" [disabled]="!podeSalvar"
            (onClick)="onSave()" />
    </ng-template>
</p-dialog>
