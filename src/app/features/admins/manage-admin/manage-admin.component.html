<div class="card-container">
    <p-card>
        <h1 class="title-admin">Administradores</h1>

        <div class="search-admin-container">
            <input pInputText type="text" placeholder="Buscar..." aria-label="Buscar administrador"
                [(ngModel)]="busca" />
            <button pButton aria-label="Novo administrador" (click)="abrirNovo()">
                <i class="pi pi-plus"></i>
            </button>
        </div>

        <div class="admin-filter">
            <p-selectbutton [options]="opcoesFiltro" [(ngModel)]="filtro" optionLabel="label" optionValue="value"
                [allowEmpty]="false" />
        </div>

        <ul class="admin-list">

            @if (erro(); as mensagem) {
            <li class="admin-empty">{{ mensagem }}</li>
            }

            @for (admin of administradoresFiltrados; track admin.id) {
            <li class="admin-row">

                <button type="button" class="admin-item" (click)="abrirFicha(admin)">
                    <span class="admin-avatar">{{ iniciais(admin.nome) }}</span>

                    <span class="admin-info">
                        <strong>{{ admin.nome }}</strong>
                        <span class="admin-meta">{{ admin.nivel }}</span>
                    </span>

                    <i class="pi pi-chevron-right"></i>
                </button>

                <button type="button" class="status-button" [class.reactivate]="!admin.ativo"
                    (click)="alternarSituacao(admin)">
                    <i class="pi" [class.pi-ban]="admin.ativo" [class.pi-replay]="!admin.ativo"></i>
                    {{ admin.ativo ? 'Inativar' : 'Reativar' }}
                </button>

            </li>
            } @empty {
            <li class="admin-empty">{{ carregando() ? 'Carregando...' : 'Nenhum administrador encontrado.' }}</li>
            }

        </ul>
    </p-card>
</div>

<app-new-admin-modal [(visible)]="showModal" [modo]="modo" [admin]="selecionado" (salvar)="salvar($event)"
    (salvo)="recarregar()" (editar)="modo = 'editar'" (desativar)="alternarSituacao(selecionado!)" />
