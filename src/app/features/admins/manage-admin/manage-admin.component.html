<app-navbar-desktop-admin></app-navbar-desktop-admin>
<app-banner></app-banner>

<div class="card-container">
    <p-card>
        <h1 class="title-admin">Administradores</h1>

        <div class="search-admin-container">
            <input pInputText type="text" placeholder="Buscar..." aria-label="Buscar administrador" />
            <button pButton aria-label="Novo administrador" (click)="abrirNovo()">
                <i class="pi pi-plus"></i>
            </button>
        </div>

        <ul class="admin-list">
            @for (admin of administradores; track admin.id) {
            <li class="admin-item">
                <div class="admin-info">
                    <div class="admin-title">
                        <strong>{{ admin.nome }}</strong>
                        <p-tag [value]="admin.ativo ? 'Ativo' : 'Inativo'"
                            [severity]="admin.ativo ? 'success' : 'secondary'" />
                    </div>
                    <span class="admin-cpf">{{ admin.cpf }}</span>
                </div>

                <div class="admin-buttons">
                    <button pButton size="small" [text]="true" [rounded]="true" aria-label="Editar"
                        (click)="abrirFicha(admin)">
                        <i class="pi pi-pencil"></i>
                    </button>
                    <button pButton size="small" [text]="true" [rounded]="true"
                        [severity]="admin.ativo ? 'danger' : 'success'"
                        [attr.aria-label]="admin.ativo ? 'Desativar' : 'Reativar'" (click)="alternarSituacao(admin)">
                        <i [class]="admin.ativo ? 'pi pi-ban' : 'pi pi-check'"></i>
                    </button>
                </div>
            </li>
            }
        </ul>
    </p-card>
</div>

<app-new-admin-modal [(visible)]="showModal" [modo]="modo" [admin]="selecionado" (salvar)="salvar($event)"
    (editar)="modo = 'editar'" (desativar)="alternarSituacao(selecionado!)" />

<app-footer></app-footer>
