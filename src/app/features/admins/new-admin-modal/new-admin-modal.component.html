<p-dialog
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '46rem', maxWidth: '95vw' }"
  header="Novo administrador"
>
  @if (visible) {
    <app-professional-form [administrator]="true" (saved)="complete()" (cancel)="close()" />
  }
</p-dialog>
