<dl class="dados">
    <dt>Nome</dt>
    <dd>{{ perfil.nome }}</dd>

    <dt>CPF</dt>
    <dd>{{ perfil.cpf }}</dd>

    <dt>Nascimento</dt>
    <dd>{{ nascimento }}</dd>

    <dt>Registro profissional</dt>
    <dd>{{ perfil.registroProfissional }}</dd>
</dl>

<section class="contato">
    <h3>Telefone</h3>

    @if (editando) {

    <!-- [value] põe o valor no campo; (input) traz de volta o que foi digitado.
         O $any(...) é porque o TypeScript não sabe que esse alvo tem .value. -->
    <input type="tel" class="campo" placeholder="(12) 99999-9999" [value]="rascunho"
        (input)="rascunho = $any($event.target).value">

    @if (rascunho && !telefoneValido) {
    <p class="erro-campo">Use o formato (12) 99999-9999</p>
    }

    <div class="botoes">
        <button type="button" class="secundario" (click)="cancelar()">Cancelar</button>
        <button type="button" [disabled]="!telefoneValido" (click)="salvar()">Salvar</button>
    </div>

    } @else {

    <p class="valor">{{ perfil.telefone }}</p>
    <button type="button" class="secundario" (click)="abrirEdicao()">Alterar</button>

    }
</section>
