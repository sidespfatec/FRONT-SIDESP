<section class="perfil">

    <!-- Os três estados da tela. Sempre trate os três. -->

    @if (carregando) {
    <p class="aviso">Carregando seu perfil...</p>
    }

    @if (erro) {
    <p class="aviso erro" role="alert">{{ erro }}</p>
    }

    <!-- 'as p' guarda o valor num apelido: dentro do bloco, p existe com
         certeza, então não precisa de perfil?.nome o tempo todo. -->
    @if (perfil; as p) {
    <app-personal-data [perfil]="p" />
    <app-schedule />
    }


</section>
