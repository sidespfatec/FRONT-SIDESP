<!-- Casca da aplicacao.
     A navbar, o banner e o footer ficam aqui, uma vez so, em vez de repetidos
     em cada tela. O que muda de rota para rota e apenas o <router-outlet />.

     Login e cadastro nao recebem navbar nem footer: quem ainda nao entrou nao
     tem menu para navegar. O cadastro tambem nao recebe banner, que e como
     a tela ja era antes. -->

@if (mostrarNavegacao()) {
<app-navbar-desktop-admin />
}

@if (mostrarBanner()) {
<app-banner />
}

<router-outlet />

@if (mostrarNavegacao()) {
<app-footer />
}
